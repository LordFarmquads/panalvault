<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PanelVault - Comic Book Tracker & Reading Journal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            comic: {
              bg: '#0b0f19',
              card: '#151c2c',
              border: '#2a364f',
              accent: '#ef4444',
              gold: '#f59e0b',
              blue: '#3b82f6',
              purple: '#8b5cf6',
              cyan: '#06b6d4'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Bangers', 'Impact', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts for Comic Headers & Clean Body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Compat JS SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    /* Custom Scrollbar for Sleek Dark Theme */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a364f;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3b82f6;
    }

    /* Halftone dot pattern overlay for classic comic aesthetics */
    .comic-dots {
      background-image: radial-gradient(rgba(239, 68, 68, 0.15) 1px, transparent 0);
      background-size: 12px 12px;
    }

    /* Comic banner drop shadow effect */
    .comic-shadow {
      box-shadow: 4px 4px 0px 0px rgba(239, 68, 68, 0.8);
    }
    .comic-shadow-gold {
      box-shadow: 4px 4px 0px 0px rgba(245, 158, 11, 0.8);
    }
    .comic-shadow-blue {
      box-shadow: 4px 4px 0px 0px rgba(59, 130, 246, 0.8);
    }

    .comic-title-font {
      font-family: 'Bangers', cursive, Impact;
      letter-spacing: 1px;
    }
  </style>
</head>
<body class="bg-comic-bg text-gray-100 min-h-screen antialiased selection:bg-comic-accent selection:text-white pb-16">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- FIREBASE USER CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyCkQlrIZNulCIySAu-XTozRLI4xjGjMXNI",
      authDomain: "panalvault.firebaseapp.com",
      databaseURL: "https://panalvault-default-rtdb.firebaseio.com",
      projectId: "panalvault",
      storageBucket: "panalvault.firebasestorage.app",
      messagingSenderId: "360997151189",
      appId: "1:360997151189:web:5355bfe23a8148bee49d5c",
      measurementId: "G-86JSF55T1J"
    };

    // Initialize Firebase once
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    // --- PRE-POPULATED SAMPLE DATA ---
    const INITIAL_COMICS = [
      {
        id: "sample-1",
        title: "The Amazing Spider-Man",
        issue: "Vol 1 #300",
        publisher: "Marvel",
        writer: "David Michelinie",
        artist: "Todd McFarlane",
        coverRating: 5.0,
        artRating: 5.0,
        storyRating: 4.5,
        overallRating: 4.8,
        coverUrl: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=600&auto=format&fit=crop&q=80",
        synopsis: "First full appearance of Venom (Eddie Brock)! Todd McFarlane's iconic artwork reaches its absolute peak here. The alien symbiote suit storyline comes to a thrilling climax as Peter Parker confronts his dark reflection.",
        keyIssue: true,
        keyReason: "First Full Appearance of Venom",
        status: "Read",
        dateAdded: "2026-10-15",
        favorite: true
      },
      {
        id: "sample-2",
        title: "Batman: Year One",
        issue: "Batman #404",
        publisher: "DC",
        writer: "Frank Miller",
        artist: "David Mazzucchelli",
        coverRating: 4.5,
        artRating: 5.0,
        storyRating: 5.0,
        overallRating: 4.8,
        coverUrl: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=600&auto=format&fit=crop&q=80",
        synopsis: "Frank Miller and David Mazzucchelli redefine the Dark Knight's origin story. Gotham is portrayed as gritty, corrupt, and terrifyingly real. Focuses as much on Jim Gordon's struggle as Bruce Wayne's early mistakes.",
        keyIssue: true,
        keyReason: "Origin story reboot of Batman & Jim Gordon",
        status: "Read",
        dateAdded: "2026-10-20",
        favorite: true
      },
      {
        id: "sample-3",
        title: "Saga",
        issue: "Vol 1 #1",
        publisher: "Image",
        writer: "Brian K. Vaughan",
        artist: "Fiona Staples",
        coverRating: 5.0,
        artRating: 5.0,
        storyRating: 5.0,
        overallRating: 5.0,
        coverUrl: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&auto=format&fit=crop&q=80",
        synopsis: "An epic space opera fantasy blend following Alana and Marko, two soldiers from opposing sides of a galactic war who fall in love and risk everything to raise their newborn daughter Hazel.",
        keyIssue: true,
        keyReason: "First issue of critically acclaimed saga",
        status: "Read",
        dateAdded: "2026-10-25",
        favorite: false
      }
    ];

    // --- UTILITY FUNCTIONS ---
    const calculateOverall = (cover, art, story) => {
      const c = parseFloat(cover) || 0;
      const a = parseFloat(art) || 0;
      const s = parseFloat(story) || 0;
      return Math.round(((c + a + s) / 3) * 10) / 10;
    };

    const getPublisherBadgeColor = (publisher) => {
      const pub = (publisher || '').toLowerCase();
      if (pub.includes('marvel')) return 'bg-red-600 text-white';
      if (pub.includes('dc')) return 'bg-blue-600 text-white';
      if (pub.includes('image')) return 'bg-black text-white border border-gray-600';
      if (pub.includes('idw')) return 'bg-amber-600 text-white';
      if (pub.includes('dark horse')) return 'bg-yellow-700 text-white';
      if (pub.includes('boom')) return 'bg-emerald-600 text-white';
      return 'bg-purple-600 text-white';
    };

    // --- STAR RATING COMPONENT (Decluttered & Clean) ---
    const StarRating = ({ value, onChange, label, readonly = false, size = "md" }) => {
      const [hoverValue, setHoverValue] = useState(null);
      const activeVal = hoverValue !== null ? hoverValue : (parseFloat(value) || 0);

      const starSizes = {
        sm: "text-xs",
        md: "text-base sm:text-lg",
        lg: "text-xl sm:text-2xl"
      };

      const stars = [1, 2, 3, 4, 5];

      return (
        <div className="flex flex-col gap-1.5 bg-comic-bg/80 p-3 rounded-xl border border-comic-border/70">
          {label && (
            <div className="flex justify-between items-center text-xs sm:text-sm font-semibold text-gray-200">
              <span>{label}</span>
              <span className="font-black text-comic-gold bg-black/60 px-2 py-0.5 rounded-md border border-comic-gold/30">
                {activeVal.toFixed(1)} / 5.0
              </span>
            </div>
          )}
          <div className="flex items-center justify-between py-1">
            <div className="flex items-center gap-1.5">
              {stars.map((star) => {
                const diff = activeVal - star;
                let iconClass = "fa-regular fa-star text-gray-600";
                if (diff >= 0) {
                  iconClass = "fa-solid fa-star text-comic-gold";
                } else if (diff >= -0.5) {
                  iconClass = "fa-solid fa-star-half-stroke text-comic-gold";
                }

                return (
                  <div key={star} className="relative inline-block cursor-pointer select-none">
                    <i className={`${iconClass} ${starSizes[size]} transition-transform duration-150 hover:scale-125`}></i>
                    {!readonly && (
                      <div className="absolute inset-0 flex">
                        {/* Left half step 0.5 */}
                        <div 
                          className="w-1/2 h-full z-10"
                          onMouseEnter={() => setHoverValue(star - 0.5)}
                          onMouseLeave={() => setHoverValue(null)}
                          onClick={() => onChange && onChange(star - 0.5)}
                        />
                        {/* Right half step 1.0 */}
                        <div 
                          className="w-1/2 h-full z-10"
                          onMouseEnter={() => setHoverValue(star)}
                          onMouseLeave={() => setHoverValue(null)}
                          onClick={() => onChange && onChange(star)}
                        />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      // Data State
      const [comics, setComics] = useState(() => {
        const saved = localStorage.getItem('panelvault_comics_v1');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { console.error(e); }
        }
        return INITIAL_COMICS;
      });

      // Firebase Sync Status: 'synced' | 'syncing' | 'offline'
      const [syncStatus, setSyncStatus] = useState('syncing');

      // Filter & View States
      const [searchQuery, setSearchQuery] = useState('');
      const [publisherFilter, setPublisherFilter] = useState('All');
      const [minRatingFilter, setMinRatingFilter] = useState('0');
      const [statusFilter, setStatusFilter] = useState('All');
      const [sortBy, setSortBy] = useState('newest'); 
      const [viewMode, setViewMode] = useState('grid'); 

      // UI States
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingComic, setEditingComic] = useState(null);
      const [viewingComic, setViewingComic] = useState(null);
      const [deletingComic, setDeletingComic] = useState(null);
      const [isDataModalOpen, setIsDataModalOpen] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      // Form State
      const [formData, setFormData] = useState({
        title: '',
        issue: '',
        publisher: 'Marvel',
        customPublisher: '',
        writer: '',
        artist: '',
        coverRating: 4.0,
        artRating: 4.0,
        storyRating: 4.0,
        coverUrl: '',
        synopsis: '',
        keyIssue: false,
        keyReason: '',
        status: 'Read',
        favorite: false
      });

      // --- FIREBASE REALTIME LISTENER & INITIAL SYNC ---
      useEffect(() => {
        const dbRef = database.ref('comics');

        const handleValue = (snapshot) => {
          const val = snapshot.val();
          if (val && Array.isArray(val)) {
            setComics(val);
            localStorage.setItem('panelvault_comics_v1', JSON.stringify(val));
          } else if (val === null) {
            // If cloud database is empty, seed it with initial comics
            const savedLocal = localStorage.getItem('panelvault_comics_v1');
            const initialData = savedLocal ? JSON.parse(savedLocal) : INITIAL_COMICS;
            dbRef.set(initialData);
            setComics(initialData);
          }
          setSyncStatus('synced');
        };

        const handleError = (error) => {
          console.error("Firebase Realtime Database error:", error);
          setSyncStatus('offline');
        };

        dbRef.on('value', handleValue, handleError);

        return () => dbRef.off('value', handleValue);
      }, []);

      // Function to persist changes to Cloud & Local Storage
      const updateComicsDatabase = (newComicsList) => {
        setComics(newComicsList);
        localStorage.setItem('panelvault_comics_v1', JSON.stringify(newComicsList));
        setSyncStatus('syncing');

        database.ref('comics').set(newComicsList, (error) => {
          if (error) {
            console.error("Cloud write failed:", error);
            setSyncStatus('offline');
            showNotification('Saved locally (Offline/Error syncing)');
          } else {
            setSyncStatus('synced');
          }
        });
      };

      // Toast notification launcher
      const showNotification = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Handle Add / Edit submit
      const handleFormSubmit = (e) => {
        e.preventDefault();

        if (!formData.title.trim()) {
          showNotification('Please enter a comic title!');
          return;
        }

        const computedPublisher = formData.publisher === 'Other' && formData.customPublisher
          ? formData.customPublisher.trim()
          : formData.publisher;

        const overall = calculateOverall(formData.coverRating, formData.artRating, formData.storyRating);

        let updatedList;
        if (editingComic) {
          // Update existing issue
          updatedList = comics.map(item => item.id === editingComic.id ? {
            ...item,
            ...formData,
            publisher: computedPublisher,
            overallRating: overall
          } : item);
          showNotification(`Updated "${formData.title}" in cloud vault!`);
        } else {
          // Add new issue
          const newEntry = {
            ...formData,
            id: 'comic-' + Date.now(),
            publisher: computedPublisher,
            overallRating: overall,
            dateAdded: new Date().toISOString().split('T')[0]
          };
          updatedList = [newEntry, ...comics];
          showNotification(`Added "${formData.title}" to cloud vault!`);
        }

        updateComicsDatabase(updatedList);
        closeFormModal();
      };

      const openAddModal = () => {
        setEditingComic(null);
        setFormData({
          title: '',
          issue: '',
          publisher: 'Marvel',
          customPublisher: '',
          writer: '',
          artist: '',
          coverRating: 4.0,
          artRating: 4.0,
          storyRating: 4.0,
          coverUrl: '',
          synopsis: '',
          keyIssue: false,
          keyReason: '',
          status: 'Read',
          favorite: false
        });
        setIsModalOpen(true);
      };

      const openEditModal = (comic) => {
        setEditingComic(comic);
        setFormData({
          title: comic.title || '',
          issue: comic.issue || '',
          publisher: ['Marvel', 'DC', 'Image', 'IDW', 'Dark Horse', 'Boom! Studios'].includes(comic.publisher) ? comic.publisher : 'Other',
          customPublisher: ['Marvel', 'DC', 'Image', 'IDW', 'Dark Horse', 'Boom! Studios'].includes(comic.publisher) ? '' : comic.publisher,
          writer: comic.writer || '',
          artist: comic.artist || '',
          coverRating: comic.coverRating || 4.0,
          artRating: comic.artRating || 4.0,
          storyRating: comic.storyRating || 4.0,
          coverUrl: comic.coverUrl || '',
          synopsis: comic.synopsis || '',
          keyIssue: comic.keyIssue || false,
          keyReason: comic.keyReason || '',
          status: comic.status || 'Read',
          favorite: comic.favorite || false
        });
        setIsModalOpen(true);
      };

      const closeFormModal = () => {
        setIsModalOpen(false);
        setEditingComic(null);
      };

      // Custom Delete Confirmation Execution
      const confirmDeleteComic = () => {
        if (!deletingComic) return;
        const targetId = deletingComic.id;
        const title = deletingComic.title;
        const updatedList = comics.filter(c => c.id !== targetId);
        
        updateComicsDatabase(updatedList);
        showNotification(`Deleted "${title}" from cloud vault.`);
        
        if (viewingComic && viewingComic.id === targetId) {
          setViewingComic(null);
        }
        setDeletingComic(null);
      };

      const toggleFavorite = (id, e) => {
        if (e) e.stopPropagation();
        const updatedList = comics.map(c => c.id === id ? { ...c, favorite: !c.favorite } : c);
        updateComicsDatabase(updatedList);
      };

      // File Cover Image Upload Reader
      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 2 * 1024 * 1024) {
            showNotification('Image size is over 2MB. Please use a smaller photo.');
            return;
          }
          const reader = new FileReader();
          reader.onloadend = () => {
            setFormData(prev => ({ ...prev, coverUrl: reader.result }));
            showNotification('Cover photo attached!');
          };
          reader.readAsDataURL(file);
        }
      };

      // Backup & Export Functions
      const exportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(comics, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `panelvault_cloud_backup_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showNotification('JSON backup downloaded!');
      };

      const exportCSV = () => {
        if (comics.length === 0) {
          showNotification('No comics to export!');
          return;
        }
        const headers = ["Title", "Issue", "Publisher", "Overall Rating", "Cover Rating", "Art Rating", "Story Rating", "Status", "Synopsis"];
        const rows = comics.map(c => [
          `"${(c.title || '').replace(/"/g, '""')}"`,
          `"${(c.issue || '').replace(/"/g, '""')}"`,
          `"${(c.publisher || '').replace(/"/g, '""')}"`,
          c.overallRating || 0,
          c.coverRating || 0,
          c.artRating || 0,
          c.storyRating || 0,
          `"${c.status || ''}"`,
          `"${(c.synopsis || '').replace(/"/g, '""')}"`
        ]);

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `panelvault_comics_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        link.remove();
        showNotification('CSV exported successfully!');
      };

      const importJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported)) {
              updateComicsDatabase(imported);
              showNotification(`Synced ${imported.length} imported comics to cloud!`);
              setIsDataModalOpen(false);
            } else {
              showNotification('Invalid JSON structure.');
            }
          } catch (err) {
            showNotification('Error reading JSON file.');
          }
        };
        reader.readAsText(file);
      };

      const restoreSampleData = () => {
        updateComicsDatabase(INITIAL_COMICS);
        showNotification('Sample comic library restored to cloud!');
        setIsDataModalOpen(false);
      };

      // Calculated Stats for Summary Dashboard
      const stats = useMemo(() => {
        const total = comics.length;
        if (total === 0) {
          return { total: 0, avgOverall: 0, avgCover: 0, avgArt: 0, avgStory: 0, topComic: null, keyIssuesCount: 0 };
        }

        let sumOverall = 0, sumCover = 0, sumArt = 0, sumStory = 0;
        let topComic = comics[0];
        let keyIssuesCount = 0;

        comics.forEach(c => {
          const ov = c.overallRating || calculateOverall(c.coverRating, c.artRating, c.storyRating);
          sumOverall += ov;
          sumCover += (c.coverRating || 0);
          sumArt += (c.artRating || 0);
          sumStory += (c.storyRating || 0);

          if (c.keyIssue) keyIssuesCount++;

          if (!topComic || ov > (topComic.overallRating || 0)) {
            topComic = c;
          }
        });

        return {
          total,
          avgOverall: (sumOverall / total).toFixed(1),
          avgCover: (sumCover / total).toFixed(1),
          avgArt: (sumArt / total).toFixed(1),
          avgStory: (sumStory / total).toFixed(1),
          topComic,
          keyIssuesCount
        };
      }, [comics]);

      // Filter & Sort Logic
      const filteredComics = useMemo(() => {
        return comics.filter(c => {
          const q = searchQuery.toLowerCase().trim();
          const matchesSearch = !q || (
            (c.title && c.title.toLowerCase().includes(q)) ||
            (c.issue && c.issue.toLowerCase().includes(q)) ||
            (c.publisher && c.publisher.toLowerCase().includes(q)) ||
            (c.synopsis && c.synopsis.toLowerCase().includes(q)) ||
            (c.writer && c.writer.toLowerCase().includes(q)) ||
            (c.artist && c.artist.toLowerCase().includes(q))
          );

          const matchesPub = publisherFilter === 'All' || c.publisher === publisherFilter;
          const matchesRating = parseFloat(c.overallRating || 0) >= parseFloat(minRatingFilter);
          const matchesStatus = statusFilter === 'All' || c.status === statusFilter;

          return matchesSearch && matchesPub && matchesRating && matchesStatus;
        }).sort((a, b) => {
          if (sortBy === 'rating_high') return (b.overallRating || 0) - (a.overallRating || 0);
          if (sortBy === 'cover_high') return (b.coverRating || 0) - (a.coverRating || 0);
          if (sortBy === 'art_high') return (b.artRating || 0) - (a.artRating || 0);
          if (sortBy === 'story_high') return (b.storyRating || 0) - (a.storyRating || 0);
          if (sortBy === 'title_az') return (a.title || '').localeCompare(b.title || '');
          return new Date(b.dateAdded || 0) - new Date(a.dateAdded || 0);
        });
      }, [comics, searchQuery, publisherFilter, minRatingFilter, statusFilter, sortBy]);

      // Unique publishers list for filter
      const uniquePublishers = useMemo(() => {
        const set = new Set(comics.map(c => c.publisher).filter(Boolean));
        return Array.from(set);
      }, [comics]);

      return (
        <div className="min-h-screen comic-dots flex flex-col">
          {/* Toast Notification Banner */}
          {toastMessage && (
            <div className="fixed top-5 right-5 z-50 bg-comic-accent text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-red-400 animate-bounce">
              <i className="fa-solid fa-bolt text-yellow-300 text-lg"></i>
              <span className="font-semibold text-sm sm:text-base">{toastMessage}</span>
            </div>
          )}

          {/* HEADER / NAVIGATION BAR */}
          <header className="sticky top-0 z-40 bg-comic-card/95 backdrop-blur-md border-b border-comic-border px-4 py-3 sm:px-8">
            <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
              {/* Brand Logo & Cloud Status */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-tr from-red-600 to-yellow-500 rounded-xl flex items-center justify-center text-white text-xl sm:text-2xl shadow-lg comic-shadow">
                  <i className="fa-solid fa-book-open border-2 border-black rounded p-0.5"></i>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-2xl sm:text-3xl font-extrabold text-white tracking-wider comic-title-font leading-none">
                      PANEL<span className="text-comic-accent">VAULT</span>
                    </h1>
                    
                    {/* Live Cloud Sync Badge */}
                    <div className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold flex items-center gap-1.5 border ${
                      syncStatus === 'synced' ? 'bg-emerald-950/80 text-emerald-400 border-emerald-800' :
                      syncStatus === 'syncing' ? 'bg-amber-950/80 text-amber-400 border-amber-800 animate-pulse' :
                      'bg-red-950/80 text-red-400 border-red-800'
                    }`}>

                    {formData.publisher === 'Other' && (
                      <div>
                        <label className="block text-xs font-semibold uppercase text-gray-300 mb-1">
                          Custom Publisher Name
                        </label>
                        <input
                          type="text"
                          placeholder="e.g., AWA Studios, Self-Published"
                          value={formData.customPublisher}
                          onChange={(e) => setFormData(prev => ({ ...prev, customPublisher: e.target.value }))}
                          className="w-full bg-comic-bg border border-comic-border rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-comic-accent transition"
                        />
                      </div>
                    )}

                    <div>
                      <label className="block text-xs font-semibold uppercase text-gray-300 mb-1">
                        Writer (Optional)
                      </label>
                      <input
                        type="text"
                        placeholder="e.g., Jonathan Hickman"
                        value={formData.writer}
                        onChange={(e) => setFormData(prev => ({ ...prev, writer: e.target.value }))}
                        className="w-full bg-comic-bg border border-comic-border rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-comic-accent transition"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold uppercase text-gray-300 mb-1">
                        Artist (Optional)
                      </label>
                      <input
                        type="text"
                        placeholder="e.g., Alex Ross, Jim Lee"
                        value={formData.artist}
                        onChange={(e) => setFormData(prev => ({ ...prev, artist: e.target.value }))}
                        className="w-full bg-comic-bg border border-comic-border rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-comic-accent transition"
                      />
                    </div>
                  </div>

                  {/* Cover Image URL / File Upload */}
                  <div className="space-y-2 pt-2 border-t border-comic-border">
                    <label className="block text-xs font-semibold uppercase text-gray-300">
                      Cover Art URL or File Upload
                    </label>
                    <div className="flex flex-col sm:flex-row gap-3 items-center">
                      <input
                        type="text"
                        placeholder="Paste image URL (https://...)"
                        value={formData.coverUrl}
                        onChange={(e) => setFormData(prev => ({ ...prev, coverUrl: e.target.value }))}
                        className="w-full bg-comic-bg border border-comic-border rounded-lg px-3.5 py-2 text-xs text-white focus:outline-none focus:border-comic-accent transition"
                      />
                      <label className="w-full sm:w-auto flex-shrink-0 cursor-pointer px-4 py-2 bg-slate-800 hover:bg-slate-700 text-gray-300 rounded-lg text-xs font-medium border border-comic-border transition flex items-center justify-center gap-2">
                        <i className="fa-solid fa-upload text-comic-blue"></i>
                        <span>Upload Photo</span>
                        <input
                          type="file"
                          accept="image/*"
                          onChange={handleImageUpload}
                          className="hidden"
                        />
                      </label>
                    </div>
                  </div>

                  {/* DECLUTTERED STAR RATINGS */}
                  <div className="bg-slate-900/90 border border-comic-border rounded-xl p-4 space-y-4">
                    <div className="flex items-center justify-between border-b border-comic-border/60 pb-2">
                      <h3 className="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                        <i className="fa-solid fa-star text-comic-gold"></i> Category Ratings (1 - 5 Stars)
                      </h3>
                      <div className="bg-black px-3 py-1 rounded-lg border border-comic-gold flex items-center gap-2">
                        <span className="text-xs text-gray-400 uppercase font-semibold">Calculated Overall:</span>
                        <span className="text-base font-black text-comic-gold">
                          {calculateOverall(formData.coverRating, formData.artRating, formData.storyRating)} ★
                        </span>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <StarRating
                        label="🎨 Cover Art"
                        value={formData.coverRating}
                        onChange={(val) => setFormData(prev => ({ ...prev, coverRating: val }))}
                      />

                      <StarRating
                        label="🖌️ Interior Art"
                        value={formData.artRating}
                        onChange={(val) => setFormData(prev => ({ ...prev, artRating: val }))}
                      />

                      <StarRating
                        label="📖 Story / Script"
                        value={formData.storyRating}
                        onChange={(val) => setFormData(prev => ({ ...prev, storyRating: val }))}
                      />
                    </div>
                  </div>

                  {/* Synopsis Textarea */}
                  <div>
                    <label className="block text-xs font-semibold uppercase text-gray-300 mb-1">
                      Personal Synopsis & Review Notes
                    </label>
                    <textarea
                      rows="4"
                      placeholder="Write your personal recap, key plot points, thoughts, or favorite quotes from this issue..."
                      value={formData.synopsis}
                      onChange={(e) => setFormData(prev => ({ ...prev, synopsis: e.target.value }))}
                      className="w-full bg-comic-bg border border-comic-border rounded-lg p-3 text-xs sm:text-sm text-white placeholder-gray-500 focus:outline-none focus:border-comic-accent transition"
                    ></textarea>
                  </div>

                  {/* Key Issue Checkbox */}
                  <div className="flex items-center gap-3 bg-comic-bg/60 p-3 rounded-lg border border-comic-border">
                    <input
                      type="checkbox"
                      id="keyIssueCheck"
                      checked={formData.keyIssue}
                      onChange={(e) => setFormData(prev => ({ ...prev, keyIssue: e.target.checked }))}
                      className="w-4 h-4 accent-comic-accent rounded cursor-pointer"
                    />
                    <label htmlFor="keyIssueCheck" className="text-xs sm:text-sm text-gray-300 cursor-pointer font-medium select-none">
                      Mark as Key Issue (First appearance, iconic cover, death, major event)
                    </label>
                  </div>

                  {/* Submit Actions */}
                  <div className="pt-3 border-t border-comic-border flex items-center justify-end gap-3">
                    <button
                      type="button"
                      onClick={closeFormModal}
                      className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-gray-300 rounded-lg text-xs sm:text-sm font-medium transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2 bg-comic-accent hover:bg-red-500 text-white font-bold rounded-lg text-xs sm:text-sm transition comic-shadow"
                    >
                      {editingComic ? 'Save Cloud Changes' : 'Save To Cloud Vault'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* VIEW ISSUE DETAILS MODAL */}
          {viewingComic && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm overflow-y-auto">
              <div className="bg-comic-card border border-comic-border w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden my-8 animate-in fade-in zoom-in-95 duration-150">
                <div className="relative bg-slate-900 p-6 border-b border-comic-border flex flex-col sm:flex-row gap-6">
                  {/* Large Cover */}
                  <div className="w-full sm:w-48 aspect-[3/4] bg-slate-800 rounded-xl overflow-hidden flex-shrink-0 border border-comic-border shadow-2xl relative">
                    {viewingComic.coverUrl ? (
                      <img src={viewingComic.coverUrl} alt={viewingComic.title} className="w-full h-full object-cover" />
                    ) : (
                      <div className="w-full h-full flex flex-col items-center justify-center text-gray-600">
                        <i className="fa-solid fa-book-open text-4xl mb-2"></i>
                        <span className="text-xs">No Cover Image</span>
                      </div>
                    )}
                  </div>

                  {/* Header info */}
                  <div className="flex-grow space-y-3">
                    <div className="flex items-start justify-between gap-3">
                      <div>
                        <span className={`px-2.5 py-1 rounded text-[10px] font-extrabold tracking-wider uppercase inline-block mb-2 ${getPublisherBadgeColor(viewingComic.publisher)}`}>
                          {viewingComic.publisher}
                        </span>
                        <h2 className="text-2xl sm:text-3xl font-extrabold text-white comic-title-font leading-tight">
                          {viewingComic.title}
                        </h2>
                        <p className="text-sm font-bold text-comic-cyan">{viewingComic.issue || 'Issue N/A'}</p>
                      </div>
                      <button
                        onClick={() => setViewingComic(null)}
                        className="text-gray-400 hover:text-white p-1 rounded-lg"
                      >
                        <i className="fa-solid fa-xmark text-xl"></i>
                      </button>
                    </div>

                    {(viewingComic.writer || viewingComic.artist) && (
                      <div className="text-xs text-gray-300 space-y-0.5">
                        {viewingComic.writer && <div><span className="text-gray-500">Writer:</span> {viewingComic.writer}</div>}
                        {viewingComic.artist && <div><span className="text-gray-500">Artist:</span> {viewingComic.artist}</div>}
                      </div>
                    )}

                    {/* Overall & Breakdown Scores */}
                    <div className="bg-comic-bg border border-comic-border rounded-xl p-3 flex items-center justify-between">
                      <div>
                        <div className="text-[10px] uppercase text-gray-400 font-semibold">Overall Rating</div>
                        <div className="text-2xl font-black text-comic-gold flex items-center gap-1">
                          {viewingComic.overallRating} <i className="fa-solid fa-star text-base"></i>
                        </div>
                      </div>

                      <div className="flex items-center gap-4 text-xs">
                        <div className="text-center">
                          <span className="block text-gray-400 text-[10px]">Cover</span>
                          <span className="font-bold text-pink-400">{viewingComic.coverRating}★</span>
                        </div>
                        <div className="text-center">
                          <span className="block text-gray-400 text-[10px]">Art</span>
                          <span className="font-bold text-blue-400">{viewingComic.artRating}★</span>
                        </div>
                        <div className="text-center">
                          <span className="block text-gray-400 text-[10px]">Story</span>
                          <span className="font-bold text-emerald-400">{viewingComic.storyRating}★</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Synopsis Body */}
                <div className="p-6 space-y-4">
                  <div>
                    <h4 className="text-xs uppercase font-extrabold tracking-wider text-comic-accent mb-2">
                      Personal Synopsis & Review Notes
                    </h4>
                    <div className="bg-comic-bg border border-comic-border/60 rounded-xl p-4 text-xs sm:text-sm text-gray-200 leading-relaxed whitespace-pre-line italic">
                      {viewingComic.synopsis ? `"${viewingComic.synopsis}"` : "No personal synopsis written for this issue."}
                    </div>
                  </div>

                  {/* Modal Footer */}
                  <div className="flex items-center justify-between pt-4 border-t border-comic-border">
                    <span className="text-xs text-gray-500">Date Logged: {viewingComic.dateAdded || 'N/A'}</span>
                    <div className="flex items-center gap-3">
                      <button
                        onClick={() => {
                          const target = viewingComic;
                          setViewingComic(null);
                          openEditModal(target);
                        }}
                        className="px-4 py-2 bg-comic-blue hover:bg-blue-600 text-white rounded-lg text-xs font-bold transition flex items-center gap-2"
                      >
                        <i className="fa-solid fa-pen-to-square"></i> Edit Issue
                      </button>
                      <button
                        onClick={() => {
                          const target = viewingComic;
                          setViewingComic(null);
                          setDeletingComic(target);
                        }}
                        className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-bold transition flex items-center gap-2"
                      >
                        <i className="fa-solid fa-trash-can"></i> Delete
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* CUSTOM DELETE CONFIRMATION MODAL */}
          {deletingComic && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-comic-card border border-comic-border w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
                <div className="w-12 h-12 bg-red-950/80 text-comic-accent rounded-full flex items-center justify-center mx-auto text-xl border border-red-800">
                  <i className="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div className="text-center">
                  <h3 className="text-lg font-extrabold text-white">Delete Comic Issue?</h3>
                  <p className="text-xs text-gray-400 mt-1">
                    Are you sure you want to remove <strong className="text-white">"{deletingComic.title}"</strong> from your cloud vault?
                  </p>
                </div>
                <div className="flex items-center gap-3 pt-2">
                  <button
                    onClick={() => setDeletingComic(null)}
                    className="w-1/2 py-2 bg-slate-800 hover:bg-slate-700 text-gray-300 rounded-xl text-xs font-bold transition"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={confirmDeleteComic}
                    className="w-1/2 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold transition shadow-lg"
                  >
                    Confirm Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* BACKUP & DATA TOOLS MODAL */}
          {isDataModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-comic-card border border-comic-border w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-5">
                <div className="flex justify-between items-center border-b border-comic-border pb-3">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-cloud-arrow-up text-comic-blue"></i> Cloud Backup & Tools
                  </h3>
                  <button onClick={() => setIsDataModalOpen(false)} className="text-gray-400 hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <p className="text-xs text-gray-300">
                  PanelVault is connected to your Firebase Realtime Database. Any changes sync instantly across your PC and Android phone.
                </p>

                <div className="space-y-3">
                  <button
                    onClick={exportJSON}
                    className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 border border-comic-border rounded-xl text-xs font-bold text-white flex items-center justify-center gap-2 transition"
                  >
                    <i className="fa-solid fa-download text-comic-gold"></i> Export Backup (JSON File)
                  </button>

                  <button
                    onClick={exportCSV}
                    className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 border border-comic-border rounded-xl text-xs font-bold text-white flex items-center justify-center gap-2 transition"
                  >
                    <i className="fa-solid fa-file-csv text-emerald-400"></i> Export Spreadsheet (CSV File)
                  </button>

                  <label className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 border border-comic-border rounded-xl text-xs font-bold text-white flex items-center justify-center gap-2 transition cursor-pointer">
                    <i className="fa-solid fa-file-import text-comic-blue"></i> Restore / Import (JSON)
                    <input type="file" accept=".json" onChange={importJSON} className="hidden" />
                  </label>

                  <button
                    onClick={restoreSampleData}
                    className="w-full py-2.5 bg-red-950/60 hover:bg-red-900/80 border border-red-800/60 rounded-xl text-xs font-bold text-red-300 flex items-center justify-center gap-2 transition"
                  >
                    <i className="fa-solid fa-rotate-left"></i> Restore Default Sample Collection
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
