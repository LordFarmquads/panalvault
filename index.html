<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PanelVault - Comic Book Tracker & Reading Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .glass-panel { background: rgba(22, 28, 45, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .star-btn { font-size: 1.5rem; color: #475569; transition: transform 0.1s, color 0.1s; cursor: pointer; }
    .star-btn:hover, .star-btn.active { color: #f59e0b; transform: scale(1.15); }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="sticky top-0 z-40 glass-panel border-b border-slate-800 py-3 px-4 md:px-8 mb-6">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="bg-gradient-to-tr from-amber-500 to-red-600 p-2.5 rounded-xl shadow-lg">
          <i class="fa-solid me-1 fa-book-open text-xl text-white"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-black text-xl tracking-tight text-white uppercase italic">PanelVault</h1>
            <span id="sync-status" class="text-xs px-2 py-0.5 rounded-full bg-red-950 text-red-400 border border-red-800 font-medium">
              <i class="fa-solid fa-circle text-[8px] mr-1"></i>Offline Mode
            </span>
          </div>
          <p class="text-xs text-slate-400">Realtime Comic Book Journal & Cloud Sync</p>
        </div>
      </div>

      <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto justify-end">
        <!-- Auth Container -->
        <div id="auth-container">
          <button id="login-btn" onclick="signInUser()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-2 rounded-lg border border-slate-700 flex items-center gap-2 transition">
            <i class="fa-brands fa-google text-amber-400"></i> Sign in with Google
          </button>
        </div>

        <button onclick="toggleBackupModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold px-3 py-2 rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
          <i class="fa-solid fa-cloud-arrow-down text-sky-400"></i> Backup & Tools
        </button>
        <button onclick="openComicModal()" class="bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white text-xs font-bold px-4 py-2 rounded-lg shadow-lg flex items-center gap-1.5 transition">
          <i class="fa-solid fa-plus"></i> Log Comic
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-4 md:px-8">
    <div id="stats-dashboard" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>
    <div id="controls-bar" class="glass-panel p-3 rounded-xl mb-6 flex flex-wrap items-center gap-3">
      <input type="text" id="search-input" oninput="renderVault()" placeholder="Search title, issue, synopsis, writer..." class="bg-slate-900 border border-slate-700 text-sm rounded-lg px-3 py-2 text-white flex-1 min-w-[200px]">
    </div>
    <div id="comic-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
  </main>

  <!-- Firebase Web SDK v9 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkQlrIZNulCIySAu-XTozRLI4xjGjMXNI",
      authDomain: "panalvault.firebaseapp.com",
      databaseURL: "https://panalvault-default-rtdb.firebaseio.com",
      projectId: "panalvault",
      storageBucket: "panalvault.firebasestorage.app",
      messagingSenderId: "360997151189",
      appId: "1:360997151189:web:5355bfe23a8148bee49d5c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let vaultComics = [];

    window.signInUser = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("Sign-in failed: " + err.message + "\nEnsure lordfarmquads.github.io is added to Authorized Domains in Firebase Console.");
      }
    };

    window.signOutUser = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      const statusEl = document.getElementById('sync-status');
      const authContainer = document.getElementById('auth-container');

      if (user) {
        currentUser = user;
        statusEl.className = "text-xs px-2 py-0.5 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800 font-medium";
        statusEl.innerHTML = `<i class="fa-solid fa-circle text-[8px] mr-1"></i>Online / Synced`;

        authContainer.innerHTML = `
          <div class="flex items-center gap-2 bg-slate-800/80 px-2.5 py-1 rounded-lg border border-slate-700">
            <img src="${user.photoURL || ''}" class="w-5 h-5 rounded-full">
            <span class="text-xs text-slate-300 font-medium hidden md:inline">${user.displayName}</span>
            <button onclick="signOutUser()" class="text-xs text-slate-400 hover:text-red-400 ml-1"><i class="fa-solid fa-right-from-bracket"></i></button>
          </div>
        `;

        // Listen for Realtime Database Updates
        const userRef = ref(db, `users/${user.uid}/comics`);
        onValue(userRef, (snapshot) => {
          vaultComics = snapshot.val() || [];
          renderVault();
        });
      } else {
        currentUser = null;
        statusEl.className = "text-xs px-2 py-0.5 rounded-full bg-red-950 text-red-400 border border-red-800 font-medium";
        statusEl.innerHTML = `<i class="fa-solid fa-circle text-[8px] mr-1"></i>Offline Mode`;
        authContainer.innerHTML = `
          <button onclick="signInUser()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-2 rounded-lg border border-slate-700 flex items-center gap-2 transition">
            <i class="fa-brands fa-google text-amber-400"></i> Sign in with Google
          </button>
        `;
      }
    });

    function renderVault() {
      // Rendering logic
    }
  </script>
</body>
</html>
